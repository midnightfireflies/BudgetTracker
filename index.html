<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Budget Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; margin-top: 0; color: #333; }
        
        .salary-group { margin-bottom: 25px; }
        .salary-group label { font-weight: bold; display: block; margin-bottom: 5px; color: #555;}
        .salary-group input { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #007bff; border-radius: 6px; box-sizing: border-box; }

        .row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; }
        .row input[type="text"] { flex: 2; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .row input[type="number"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; text-align: center;}
        .amount { flex: 1.2; text-align: right; font-weight: bold; color: #333; }
        
        button { cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0.2s;}
        .del-btn { background: #dc3545; color: white; padding: 8px 12px; }
        .del-btn:hover { background: #c82333; }
        .add-btn { background: #28a745; color: white; width: 100%; padding: 12px; margin-top: 10px; font-size: 15px;}
        .add-btn:hover { background: #218838; }

        .summary { margin-top: 25px; padding-top: 15px; border-top: 2px solid #eee; }
        .summary-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; }
        .error-msg { color: #dc3545; font-size: 13px; display: none; text-align: center; margin-top: 5px;}
    </style>
</head>
<body>

    <div class="card">
        <h2>Dynamic Budget</h2>
        
        <div class="salary-group">
            <label>Total Salary Amount:</label>
            <input type="number" id="salary" value="10000" oninput="calculate()">
        </div>

        <!-- The header for the columns -->
        <div class="row" style="font-weight: bold; color: #666; font-size: 14px;">
            <div style="flex: 2;">Category</div>
            <div style="flex: 1; text-align: center;">%</div>
            <div style="flex: 1.2; text-align: right; padding-right: 40px;">Amount</div>
        </div>

        <!-- Categories will be injected here by JavaScript -->
        <div id="category-list"></div>

        <button class="add-btn" onclick="addCategory()">+ Add New Category</button>
        
        <div class="error-msg" id="pct-error">Warning: Percentages must add up to exactly 100%</div>

        <div class="summary">
            <div class="summary-row">
                <span>Total %: <span id="total-pct">0</span>%</span>
                <span><span id="total-amount">0.00</span></span>
            </div>
        </div>
    </div>

    <script>
        // These are your starting categories. You can change them directly in the browser now!
        let categories = [
            { name: 'ধার শোধ', pct: 25 },
            { name: 'মেডিকেল ফান্ড', pct: 5 },
            { name: 'ইমারজেন্সি', pct: 10 },
            { name: 'Ghuraghuri', pct: 5 },
            { name: 'এক্সপেন্স', pct: 55 }
        ];

        // This function draws the rows on the screen
        function render() {
            const list = document.getElementById('category-list');
            list.innerHTML = ''; // Clear current list
            
            categories.forEach((cat, index) => {
                list.innerHTML += `
                    <div class="row">
                        <input type="text" value="${cat.name}" oninput="updateName(${index}, this.value)" placeholder="Category Name">
                        <input type="number" value="${cat.pct}" oninput="updatePct(${index}, this.value)">
                        <span class="amount" id="amt-${index}">0</span>
                        <button class="del-btn" onclick="removeCategory(${index})" title="Delete">X</button>
                    </div>
                `;
            });
            calculate(); // Recalculate everything after drawing
        }

        // Functions to handle updates when you type
        function updateName(index, val) { categories[index].name = val; }
        
        function updatePct(index, val) {
            categories[index].pct = parseFloat(val) || 0;
            calculate();
        }

        function addCategory() {
            categories.push({ name: 'New Category', pct: 0 });
            render();
        }

        function removeCategory(index) {
            categories.splice(index, 1);
            render();
        }

        // The main math engine
        function calculate() {
            const salary = parseFloat(document.getElementById('salary').value) || 0;
            let totalPct = 0;
            let totalAmt = 0;

            // Loop through each category to do the math
            categories.forEach((cat, i) => {
                totalPct += cat.pct;
                const amt = (salary * (cat.pct / 100));
                totalAmt += amt;
                
                // Update the specific row's amount text
                const amtElement = document.getElementById('amt-'+i);
                if(amtElement) amtElement.innerText = amt.toFixed(2);
            });

            // Update the bottom totals
            document.getElementById('total-pct').innerText = totalPct;
            document.getElementById('total-amount').innerText = totalAmt.toFixed(2);

            // Show a warning if it doesn't equal exactly 100%
            const errorMsg = document.getElementById('pct-error');
            if (totalPct !== 100) {
                errorMsg.style.display = 'block';
                document.getElementById('total-pct').style.color = '#dc3545';
            } else {
                errorMsg.style.display = 'none';
                document.getElementById('total-pct').style.color = 'black';
            }
        }

        // Run this once when the page loads
        render();
    </script>
</body>
</html>
