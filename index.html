<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Calculator</title>
    <style>
        /* This is the CSS to make it look nice */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .result-box { margin-top: 20px; display: none; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .total-row { font-weight: bold; font-size: 1.1em; border-bottom: 2px solid #ddd; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Budget Calculator</h2>
        <input type="number" id="salaryInput" placeholder="Enter your salary (e.g., 10000)">
        <button onclick="calculateBudget()">Calculate</button>

        <!-- This is where the results will appear -->
        <div class="result-box" id="results">
            <div class="row total-row"><span>Total Salary:</span><span id="total">0</span></div>
            <div class="row"><span>ধার শোধ (25%):</span><span id="debt">0</span></div>
            <div class="row"><span>মেডিকেল ফান্ড (5%):</span><span id="medical">0</span></div>
            <div class="row"><span>ইমারজেন্সি (10%):</span><span id="emergency">0</span></div>
            <div class="row"><span>Ghuraghuri (5%):</span><span id="travel">0</span></div>
            <div class="row"><span>এক্সপেন্স (55%):</span><span id="expense">0</span></div>
        </div>
    </div>

    <script>
        /* This is the JavaScript that does the math */
        function calculateBudget() {
            let salary = parseFloat(document.getElementById('salaryInput').value);
            
            if (isNaN(salary) || salary <= 0) {
                alert("Please enter a valid salary amount.");
                return;
            }

            // Calculate and display values
            document.getElementById('total').innerText = salary.toFixed(2);
            document.getElementById('debt').innerText = (salary * 0.25).toFixed(2);
            document.getElementById('medical').innerText = (salary * 0.05).toFixed(2);
            document.getElementById('emergency').innerText = (salary * 0.10).toFixed(2);
            document.getElementById('travel').innerText = (salary * 0.05).toFixed(2);
            document.getElementById('expense').innerText = (salary * 0.55).toFixed(2);
            
            // Unhide the results box
            document.getElementById('results').style.display = "block";
        }
    </script>
</body>
</html>
