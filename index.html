<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Budget</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f4f5;
            --surface: #ffffff;
            --text: #18181b;
            --text-light: #71717a;
            --accent: #2563eb;
            --danger: #e11d48;
            --success: #16a34a;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
        }

        .container {
            width: 100%; max-width: 450px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* Balance Card */
        .balance-card {
            background: var(--text); color: var(--surface);
            padding: 30px 20px; border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .balance-label { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }
        .balance-amount { font-size: 3.5rem; font-weight: 700; margin: 10px 0; }

        /* Action Buttons */
        .action-row { display: flex; gap: 15px; }
        .btn {
            flex: 1; padding: 15px; border: none; border-radius: 16px;
            font-family: inherit; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-income { background: var(--surface); border: 2px solid var(--text); color: var(--text); }
        .btn-expense { background: var(--surface); border: 2px solid var(--text); color: var(--text); }

        /* Budget Categories */
        .section-title { font-size: 1.1rem; font-weight: 700; margin: 10px 0 0 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .category-card {
            background: var(--surface); padding: 20px; border-radius: 20px;
            border: 1px solid #e4e4e7;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .cat-title { font-size: 0.85rem; color: var(--text-light); font-weight: 600; margin-bottom: 8px;}
        .cat-amount { font-size: 1.4rem; font-weight: 700; }

        /* History */
        .history-card {
            background: var(--surface); padding: 20px; border-radius: 20px;
            border: 1px solid #e4e4e7; min-height: 150px;
        }
        .tx-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #f4f4f5;
        }
        .tx-item:last-child { border-bottom: none; }
        .tx-info h4 { margin: 0; font-size: 0.95rem; }
        .tx-info p { margin: 4px 0 0 0; font-size: 0.75rem; color: var(--text-light); }
        .tx-amt { font-weight: 700; font-size: 1.1rem; }
        .amt-in { color: var(--success); }
        .amt-out { color: var(--danger); }
        
        .reset-btn { text-align: center; color: var(--text-light); font-size: 0.8rem; margin-top: 20px; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="balance-card">
        <div class="balance-label">Total Balance</div>
        <div class="balance-amount" id="ui-balance">0</div>
    </div>

    <div class="action-row">
        <button class="btn btn-income" onclick="addMoney('income')">+ Add Income</button>
        <button class="btn btn-expense" onclick="addMoney('expense')">- Add Expense</button>
    </div>

    <div class="section-title">Budget Allocations</div>
    <div class="grid">
        <div class="category-card">
            <div class="cat-title">ধার শোধ (25%)</div>
            <div class="cat-amount" id="cat-debt">0</div>
        </div>
        <div class="category-card">
            <div class="cat-title">ইমারজেন্সি (10%)</div>
            <div class="cat-amount" id="cat-emerg">0</div>
        </div>
        <div class="category-card">
            <div class="cat-title">মেডিকেল (5%)</div>
            <div class="cat-amount" id="cat-med">0</div>
        </div>
        <div class="category-card">
            <div class="cat-title">Ghuraghuri (5%)</div>
            <div class="cat-amount" id="cat-travel">0</div>
        </div>
    </div>

    <div class="section-title">Recent Transactions</div>
    <div class="history-card" id="ui-history">
        <!-- JS will populate this -->
    </div>

    <div class="reset-btn" onclick="clearData()">Reset All Data</div>
</div>

<script>
    let appData = {
        balance: 10000, // Starting with your example salary
        history: []
    };

    function init() {
        const saved = localStorage.getItem('my_custom_budget');
        if (saved) appData = JSON.parse(saved);
        updateUI();
    }

    function addMoney(type) {
        let amt = parseFloat(prompt("Enter amount:"));
        if (!amt || isNaN(amt)) return;

        let desc = prompt("What was this for?") || (type === 'income' ? 'Income' : 'Expense');
        
        if (type === 'expense') {
            appData.balance -= amt;
        } else {
            appData.balance += amt;
        }

        appData.history.unshift({ type, amount: amt, desc, date: new Date().toLocaleDateString() });
        saveData();
        updateUI();
    }

    function clearData() {
        if(confirm("Erase everything?")) {
            appData = { balance: 0, history: [] };
            saveData();
            updateUI();
        }
    }

    function saveData() {
        localStorage.setItem('my_custom_budget', JSON.stringify(appData));
    }

    function updateUI() {
        // Main Balance
        document.getElementById('ui-balance').innerText = appData.balance.toLocaleString();

        // Calculate custom categories based on current balance
        document.getElementById('cat-debt').innerText = (appData.balance * 0.25).toLocaleString();
        document.getElementById('cat-emerg').innerText = (appData.balance * 0.10).toLocaleString();
        document.getElementById('cat-med').innerText = (appData.balance * 0.05).toLocaleString();
        document.getElementById('cat-travel').innerText = (appData.balance * 0.05).toLocaleString();

        // History
        const histEl = document.getElementById('ui-history');
        if (appData.history.length === 0) {
            histEl.innerHTML = '<p style="text-align:center; color: #71717a; margin-top: 40px;">No transactions yet.</p>';
        } else {
            histEl.innerHTML = appData.history.map(tx => `
                <div class="tx-item">
                    <div class="tx-info">
                        <h4>${tx.desc}</h4>
                        <p>${tx.date}</p>
                    </div>
                    <div class="tx-amt ${tx.type === 'income' ? 'amt-in' : 'amt-out'}">
                        ${tx.type === 'income' ? '+' : '-'}${tx.amount.toLocaleString()}
                    </div>
                </div>
            `).join('');
        }
    }

    init();
</script>
</body>
</html>
